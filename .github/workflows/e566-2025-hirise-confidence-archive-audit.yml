name: E566 2025 HiRISE confidence archive range audit

on:
  push:
    branches:
      - research/e566-2025-hirise-confidence-archive-audit-20261112
    paths:
      - experiments/e566_2025_hirise_confidence_archive_audit.py
      - tests/test_e566_2025_hirise_confidence_archive_audit.py
      - .github/workflows/e566-2025-hirise-confidence-archive-audit.yml
  pull_request:
    branches:
      - research/e565-footprint-conditioned-nodata-null-20261112
    paths:
      - experiments/e566_2025_hirise_confidence_archive_audit.py
      - tests/test_e566_2025_hirise_confidence_archive_audit.py
      - .github/workflows/e566-2025-hirise-confidence-archive-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e566-2025-hirise-confidence-archive-audit-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded audit dependencies
        run: python -m pip install "requests>=2.31,<3" "pytest>=8,<9"
      - name: Run deterministic range and ZIP fixtures
        run: python -m pytest -q tests/test_e566_2025_hirise_confidence_archive_audit.py
      - name: Inspect the pinned 2025 DTM archive using bounded byte ranges only
        run: python -m experiments.e566_2025_hirise_confidence_archive_audit --out .artifacts/e566/receipt.json
      - name: Preserve compact receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e566-2025-hirise-confidence-archive-receipt
          path: .artifacts/e566/receipt.json
          if-no-files-found: ignore
          retention-days: 14
