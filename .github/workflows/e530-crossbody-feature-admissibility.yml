name: E530 cross-body feature admissibility

on:
  push:
    branches:
      - research/e530-paad-mgd3-feature-admissibility-20261111
    paths:
      - 'experiments/e530_crossbody_feature_admissibility.py'
      - 'experiments/test_e530_crossbody_feature_admissibility.py'
      - '.github/workflows/e530-crossbody-feature-admissibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run E530 integrity tests
        run: python -m unittest discover -s experiments -p 'test_e530_crossbody_feature_admissibility.py' -v
      - name: Compile the E530 audit
        run: python -m py_compile experiments/e530_crossbody_feature_admissibility.py
      - name: Check patch whitespace
        run: git diff --check
