name: E514 source-backed equal-physical-footprint experiment
on:
  pull_request:
    paths:
      - 'research/e514_matched_footprint.py'
      - 'research/test_e514_matched_footprint.py'
      - '.github/workflows/e514-equal-footprint.yml'
  workflow_dispatch:
jobs:
  e514:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open numeric decoders
        run: python -m pip install numpy tifffile imagecodecs
      - name: Deterministic synthetic controls
        run: python -m unittest discover -s research -p 'test_e514_matched_footprint.py' -v
      - name: Bounded real NOAA and NASA PDS acquisition, physical footprint experiment
        run: python -m research.e514_matched_footprint --output /tmp/e514_equal_footprint.json
      - name: Preserve numerical evidence including negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e514-equal-footprint-numerical-receipt
          path: /tmp/e514_equal_footprint.json
          if-no-files-found: ignore
          retention-days: 14
