name: E573 HiRISE 10.2 m translation envelope

on:
  push:
    branches:
      - research/e573-hirise-translation-envelope-20261112
    paths:
      - experiments/e573_2025_hirise_translation_envelope.py
      - experiments/e569_paired_hirise_support.py
      - experiments/e568_2025_hirise_dtm_observed_point_support.py
      - experiments/e566_2025_hirise_confidence_archive_audit.py
      - experiments/e563_three_way_common_support.py
      - experiments/e548_hirise_pixel_window.py
      - experiments/e545_mola_observed_support.py
      - tests/test_e573_2025_hirise_translation_envelope.py
      - .github/workflows/e573-hirise-translation-envelope.yml
  pull_request:
    branches:
      - research/e572-independent-analogue-catalogue-audit-20261112
    paths:
      - experiments/e573_2025_hirise_translation_envelope.py
      - experiments/e569_paired_hirise_support.py
      - experiments/e568_2025_hirise_dtm_observed_point_support.py
      - experiments/e566_2025_hirise_confidence_archive_audit.py
      - experiments/e563_three_way_common_support.py
      - experiments/e548_hirise_pixel_window.py
      - experiments/e545_mola_observed_support.py
      - tests/test_e573_2025_hirise_translation_envelope.py
      - .github/workflows/e573-hirise-translation-envelope.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e573-hirise-translation-envelope
  cancel-in-progress: true

jobs:
  support-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded geospatial dependencies
        run: python -m pip install "numpy>=1.26,<3" "requests>=2.31,<3" "tifffile>=2024.8,<2027" "rasterio>=1.4,<2" "pyproj>=3.6,<4" "pytest>=8,<9"
      - name: Run deterministic translation and summary controls
        run: python -m pytest -q tests/test_e573_2025_hirise_translation_envelope.py
      - name: Run bounded 2020/2025 support sensitivity
        run: python -m experiments.e573_2025_hirise_translation_envelope --out .artifacts/e573/receipt.json
      - name: Upload aggregate receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e573-hirise-translation-envelope
          path: .artifacts/e573/receipt.json
          if-no-files-found: ignore
          retention-days: 14
