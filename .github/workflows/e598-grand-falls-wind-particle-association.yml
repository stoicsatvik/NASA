name: E598 Grand Falls wind-particle association

on:
  push:
    branches:
      - research/e598-grand-falls-wind-particle-association-20261112
    paths:
      - FOUNDRY_STATE.md
      - experiments/e598_grand_falls_wind_particle_association.py
      - experiments/test_e598_grand_falls_wind_particle_association.py
      - .github/workflows/e598-grand-falls-wind-particle-association.yml
  pull_request:
    branches:
      - research/e597-grand-falls-row-group-semantics-20261112
    paths:
      - FOUNDRY_STATE.md
      - experiments/e598_grand_falls_wind_particle_association.py
      - experiments/test_e598_grand_falls_wind_particle_association.py
      - research/E598_GRAND_FALLS_WIND_PARTICLE_ASSOCIATION_20261112.md
      - research/results/E598_GRAND_FALLS_WIND_PARTICLE_ASSOCIATION_20261112.json
      - .github/workflows/e598-grand-falls-wind-particle-association.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e598-grand-falls-wind-particle-association
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Run deterministic tests
        run: python -m unittest experiments.test_e598_grand_falls_wind_particle_association -v
      - name: Fetch bounded public source prefix and run analysis
        run: python -m experiments.e598_grand_falls_wind_particle_association --out .artifacts/e598/receipt.json
      - name: Validate aggregate receipt
        run: python -m json.tool .artifacts/e598/receipt.json > /dev/null
      - name: Upload aggregate-only result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e598-grand-falls-wind-particle-association
          path: .artifacts/e598/receipt.json
          if-no-files-found: ignore
          retention-days: 7
