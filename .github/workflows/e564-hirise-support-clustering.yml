name: E564 HiRISE unsupported-point spatial clustering diagnostic

on:
  push:
    branches:
      - research/e564-hirise-support-clustering-20261112
    paths:
      - experiments/e563_three_way_common_support.py
      - tests/test_e564_hirise_support_clustering.py
      - .github/workflows/e564-hirise-support-clustering.yml
  pull_request:
    branches:
      - research/e563-mola-ctx-hirise-common-support-20261112
    paths:
      - experiments/e563_three_way_common_support.py
      - tests/test_e564_hirise_support_clustering.py
      - .github/workflows/e564-hirise-support-clustering.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e564-hirise-support-clustering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded geospatial dependencies
        run: python -m pip install "numpy>=1.26,<3" "requests>=2.31,<3" "tifffile>=2024.8,<2027" "rasterio>=1.4,<2" "pyproj>=3.6,<4" "pytest>=8,<9"
      - name: Run E563 geometry and E564 clustering tests
        run: python -m pytest -q tests/test_e563_three_way_common_support.py tests/test_e564_hirise_support_clustering.py
      - name: Reacquire bounded masks and calculate E564 diagnostic
        run: python -m experiments.e563_three_way_common_support --out .artifacts/e564/receipt.json
      - name: Preserve compact receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e564-hirise-support-clustering-receipt
          path: .artifacts/e564/receipt.json
          if-no-files-found: ignore
          retention-days: 14
