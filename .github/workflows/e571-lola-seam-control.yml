name: E571 LOLA seam control

on:
  push:
    branches:
      - research/e571-lola-seam-control-20261112
    paths:
      - experiments/e571_lola_seam_control.py
      - tests/test_e571_lola_seam_control.py
      - .github/workflows/e571-lola-seam-control.yml
  pull_request:
    branches:
      - research/e570-lola-gdr-window-20261112
    paths:
      - experiments/e571_lola_seam_control.py
      - tests/test_e571_lola_seam_control.py
      - .github/workflows/e571-lola-seam-control.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e571-lola-seam-control
  cancel-in-progress: true

jobs:
  seam-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded dependencies
        run: python -m pip install "requests>=2.31,<3" "pytest>=8,<9"
      - name: Run deterministic seam and overlap controls
        run: python -m pytest -q tests/test_e571_lola_seam_control.py
      - name: Acquire three bounded real LOLA windows
        run: python -m experiments.e571_lola_seam_control --out .artifacts/e571/receipt.json
      - name: Upload compact receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e571-lola-seam-control
          path: .artifacts/e571/receipt.json
          if-no-files-found: ignore
          retention-days: 14
