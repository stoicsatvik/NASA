name: E569 paired 2020-2025 HiRISE support

on:
  push:
    branches:
      - research/e569-paired-hirise-support-20261112
    paths:
      - experiments/e569_paired_hirise_support.py
      - experiments/e568_2025_hirise_dtm_observed_point_support.py
      - experiments/e566_2025_hirise_confidence_archive_audit.py
      - experiments/e563_three_way_common_support.py
      - experiments/e548_hirise_pixel_window.py
      - experiments/e545_mola_observed_support.py
      - tests/test_e569_paired_hirise_support.py
      - .github/workflows/e569-paired-hirise-support.yml
  pull_request:
    branches:
      - research/e568-2025-hirise-dtm-observed-point-support-20261112
    paths:
      - experiments/e569_paired_hirise_support.py
      - experiments/e568_2025_hirise_dtm_observed_point_support.py
      - experiments/e566_2025_hirise_confidence_archive_audit.py
      - experiments/e563_three_way_common_support.py
      - experiments/e548_hirise_pixel_window.py
      - experiments/e545_mola_observed_support.py
      - tests/test_e569_paired_hirise_support.py
      - .github/workflows/e569-paired-hirise-support.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e569-paired-hirise-support
  cancel-in-progress: true

jobs:
  paired-support:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded geospatial dependencies
        run: python -m pip install "numpy>=1.26,<3" "requests>=2.31,<3" "tifffile>=2024.8,<2027" "rasterio>=1.4,<2" "pyproj>=3.6,<4" "pytest>=8,<9"
      - name: Run deterministic paired-mask controls
        run: python -m pytest -q tests/test_e569_paired_hirise_support.py
      - name: Run bounded paired 2020/2025 acquisition
        run: python -m experiments.e569_paired_hirise_support --out .artifacts/e569/receipt.json
      - name: Upload compact aggregate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e569-paired-hirise-support
          path: .artifacts/e569/receipt.json
          if-no-files-found: ignore
