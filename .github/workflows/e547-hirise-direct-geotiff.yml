name: E547 bounded direct controlled HiRISE GeoTIFF range probe

on:
  push:
    branches:
      - research/e547-hirise-direct-geotiff-range-20261111
    paths:
      - experiments/e547_hirise_direct_geotiff_probe.py
      - tests/test_e547_hirise_direct_geotiff_probe.py
      - research/E547_HIRISE_DIRECT_GEOTIFF_PROBE_20261111.md
      - FOUNDRY_STATE.md
      - .github/workflows/e547-hirise-direct-geotiff.yml
  pull_request:
    branches:
      - research/e546-hirise-zip-range-feasibility-20261111
    paths:
      - experiments/e547_hirise_direct_geotiff_probe.py
      - tests/test_e547_hirise_direct_geotiff_probe.py
      - research/E547_HIRISE_DIRECT_GEOTIFF_PROBE_20261111.md
      - FOUNDRY_STATE.md
      - .github/workflows/e547-hirise-direct-geotiff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-direct-tiff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded TIFF probe dependencies
        run: python -m pip install "numpy>=1.26,<3" "tifffile>=2024.8,<2027" "requests>=2.31,<3" "pytest>=8,<9"
      - name: Run deterministic fixture tests
        run: python -m pytest -q tests/test_e547_hirise_direct_geotiff_probe.py
      - name: Inspect one direct TIFF segment using HTTP Range only
        run: python -m experiments.e547_hirise_direct_geotiff_probe --out .artifacts/e547/receipt.json
      - name: Preserve compact receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e547-direct-hirise-tiff-receipt
          path: .artifacts/e547/receipt.json
          if-no-files-found: ignore
          retention-days: 14
