name: E273 lunar sampling-support ablation
on:
  push:
    branches:
      - foundry/e273-lola-sampling-support-20261026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-source-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source raster dependencies
        run: python -m pip install 'numpy>=2.0,<3' 'Pillow>=11,<13' 'rasterio>=1.4,<2'
      - name: Validate deterministic controls
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download pinned public NASA and PDS source rasters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .data/e273
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 240 --silent --show-error \
            'https://svs.gsfc.nasa.gov/vis/a000000/a004700/a004720/ldem_4.tif' \
            --output .data/e273/ldem_4.tif
          base='https://pds-geosciences.wustl.edu/mgs/mgs-m-mola-5-megdr-l3-v1/mgsl_300x/meg004'
          for file in megt90n000cb.img megc90n000cb.img megt90n000cb.lbl megc90n000cb.lbl; do
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 240 --silent --show-error \
              "$base/$file" --output ".data/e273/$file"
          done
          test "$(wc -c < .data/e273/megt90n000cb.img)" -eq 2073600
          test "$(wc -c < .data/e273/megc90n000cb.img)" -eq 2073600
      - name: Execute real lunar sampling-support ablation
        shell: bash
        run: |
          set -euo pipefail
          python -m research.e273_lola_sampling_support \
            --lola .data/e273/ldem_4.tif \
            --mola .data/e273/megt90n000cb.img \
            --counts .data/e273/megc90n000cb.img \
            --mola-label .data/e273/megt90n000cb.lbl \
            --counts-label .data/e273/megc90n000cb.lbl \
            > .data/e273/e273_results.json
          python - <<'PY'
          import json
          d = json.load(open('.data/e273/e273_results.json'))
          assert d['moon_native_4x4']['n'] == 7200
          assert d['moon_coarsened_2x2_block_means']['n'] == 7200
          assert d['moon_coarsened_fraction_exceeding_native'] <= 0.001
          assert d['moon_coarsening_median_retained_fraction'] <= 1.0
          assert d['physical_support_difference_fraction'] < 0.03
          print('E273_LUNAR_SUPPORT_RETENTION', d['moon_coarsening_median_retained_fraction'])
          print('E273_TOP_DECILE_RETENTION', d['moon_top_decile_retention'])
          print('E273_MOON_MARS_RATIOS', d['moon_to_mars_median_roughness_ratio_native'], d['moon_to_mars_median_roughness_ratio_coarsened'])
          PY
      - name: Preserve machine-readable receipt, not raw rasters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e273-lola-sampling-support-evidence
          path: .data/e273/e273_results.json
          if-no-files-found: ignore
          retention-days: 30
