name: E548 bounded HiRISE pixel-window acquisition

on:
  push:
    branches:
      - research/e548-hirise-pixel-window-20261111
    paths:
      - experiments/e548_hirise_pixel_window.py
      - tests/test_e548_hirise_pixel_window.py
      - research/E548_HIRISE_PIXEL_WINDOW_20261111.md
      - .github/workflows/e548-hirise-pixel-window.yml
  pull_request:
    branches:
      - research/e547-hirise-direct-geotiff-range-20261111
    paths:
      - experiments/e548_hirise_pixel_window.py
      - tests/test_e548_hirise_pixel_window.py
      - research/E548_HIRISE_PIXEL_WINDOW_20261111.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-pixel-window:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded raster dependencies
        run: python -m pip install "numpy>=1.26,<3" "tifffile>=2024.8,<2027" "requests>=2.31,<3" "pytest>=8,<9"
      - name: Run deterministic fixtures
        run: python -m pytest -q tests/test_e548_hirise_pixel_window.py
      - name: Read one preregistered 64x64 HiRISE window using exact HTTP ranges
        run: python -m experiments.e548_hirise_pixel_window --out .artifacts/e548/receipt.json
      - name: Preserve compact receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e548-hirise-pixel-window-receipt
          path: .artifacts/e548/receipt.json
          if-no-files-found: ignore
          retention-days: 14
