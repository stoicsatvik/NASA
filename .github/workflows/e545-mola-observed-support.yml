name: E545 bounded MOLA observed-support experiment

on:
  push:
    branches:
      - research/e545-mola-observed-support-20261111
    paths:
      - experiments/e545_mola_observed_support.py
      - tests/test_e545_mola_observed_support.py
      - research/E545_MOLA_OBSERVED_SUPPORT_20261111.md
      - FOUNDRY_STATE.md
      - .github/workflows/e545-mola-observed-support.yml
  pull_request:
    branches:
      - research/e544-ctx-raw-raster-ingestion-20261111
    paths:
      - experiments/e545_mola_observed_support.py
      - tests/test_e545_mola_observed_support.py
      - research/E545_MOLA_OBSERVED_SUPPORT_20261111.md
      - FOUNDRY_STATE.md
      - .github/workflows/e545-mola-observed-support.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-observed-support:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded experiment dependencies
        run: python -m pip install "numpy>=1.26,<3" "requests>=2.31,<3" "pytest>=8,<9"
      - name: Run deterministic fixture tests
        run: python -m pytest -q tests/test_e545_mola_observed_support.py
      - name: Acquire bounded MOLA topography and counts rows
        run: python -m experiments.e545_mola_observed_support --out .artifacts/e545/receipt.json
      - name: Preserve compact receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e545-mola-observed-support-receipt
          path: .artifacts/e545/receipt.json
          if-no-files-found: ignore
          retention-days: 14
