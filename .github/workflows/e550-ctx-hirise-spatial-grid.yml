name: E550 nine-patch spatial CTX and HiRISE residual campaign

on:
  push:
    branches:
      - research/e550-ctx-hirise-spatial-residual-grid-20261111
    paths:
      - experiments/e550_ctx_hirise_spatial_grid.py
      - tests/test_e550_ctx_hirise_spatial_grid.py
      - research/E550_CTX_HIRISE_SPATIAL_GRID_20261111.md
      - .github/workflows/e550-ctx-hirise-spatial-grid.yml
  pull_request:
    branches:
      - research/e549-ctx-hirise-matched-support-20261111
    paths:
      - experiments/e550_ctx_hirise_spatial_grid.py
      - tests/test_e550_ctx_hirise_spatial_grid.py
      - research/E550_CTX_HIRISE_SPATIAL_GRID_20261111.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spatial-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install raster and CRS dependencies
        run: python -m pip install "numpy>=1.26,<3" "tifffile>=2024.8,<2027" "requests>=2.31,<3" "rasterio>=1.4,<2" "pyproj>=3.6,<4" "pytest>=8,<9"
      - name: Run deterministic spatial-design fixtures
        run: python -m pytest -q tests/test_e550_ctx_hirise_spatial_grid.py
      - name: Run nine preregistered matched-area patches
        run: python -m experiments.e550_ctx_hirise_spatial_grid --out .artifacts/e550/receipt.json
      - name: Preserve compact receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e550-spatial-grid-receipt
          path: .artifacts/e550/receipt.json
          if-no-files-found: ignore
          retention-days: 14
