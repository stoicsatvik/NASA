name: E502 bounded real MOLA paired ingestion
on:
  push:
    branches: [research/e502-real-mola-paired-grid-20261102]
  pull_request:
    paths:
      - research/e502_mola_real_ingest.py
      - tests/test_e502_mola_real_ingest.py
      - .github/workflows/e502-mola.yml

jobs:
  mola-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bounded-reader and existing PDS geometry tests
        run: python -m unittest discover -s tests -p 'test_*mola*.py' -v
      - name: Ingest real paired NASA PDS MOLA products
        run: python -m research.e502_mola_real_ingest /tmp/e502_mola.json
      - name: Preserve exact numeric and provenance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e502-mola-paired-numeric-receipt
          path: /tmp/e502_mola.json
          if-no-files-found: ignore
          retention-days: 14
