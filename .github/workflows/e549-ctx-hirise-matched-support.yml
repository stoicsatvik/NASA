name: E549 matched-support Jezero CTX and HiRISE comparison

on:
  push:
    branches:
      - research/e549-ctx-hirise-matched-support-20261111
    paths:
      - experiments/e549_ctx_hirise_matched_support.py
      - tests/test_e549_ctx_hirise_matched_support.py
      - research/E549_CTX_HIRISE_MATCHED_SUPPORT_20261111.md
      - .github/workflows/e549-ctx-hirise-matched-support.yml
  pull_request:
    branches:
      - research/e548-hirise-pixel-window-20261111
    paths:
      - experiments/e549_ctx_hirise_matched_support.py
      - tests/test_e549_ctx_hirise_matched_support.py
      - research/E549_CTX_HIRISE_MATCHED_SUPPORT_20261111.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matched-support:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install raster and CRS dependencies
        run: python -m pip install "numpy>=1.26,<3" "tifffile>=2024.8,<2027" "requests>=2.31,<3" "rasterio>=1.4,<2" "pyproj>=3.6,<4" "pytest>=8,<9"
      - name: Run deterministic geometry and area-weighting fixtures
        run: python -m pytest -q tests/test_e549_ctx_hirise_matched_support.py
      - name: Acquire bounded CTX raster and exact-range HiRISE patch
        run: python -m experiments.e549_ctx_hirise_matched_support --out .artifacts/e549/receipt.json
      - name: Preserve compact receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e549-matched-support-receipt
          path: .artifacts/e549/receipt.json
          if-no-files-found: ignore
          retention-days: 14
