name: E567 2025 HiRISE FOM confidence point support

on:
  push:
    branches:
      - research/e567-fom-confidence-point-support-20261112
    paths:
      - experiments/e566_2025_hirise_confidence_archive_audit.py
      - experiments/e567_fom_confidence_point_support.py
      - experiments/e545_mola_observed_support.py
      - experiments/e563_three_way_common_support.py
      - tests/test_e566_2025_hirise_confidence_archive_audit.py
      - tests/test_e567_fom_confidence_point_support.py
      - .github/workflows/e567-fom-confidence-point-support.yml
  pull_request:
    branches:
      - research/e566-2025-hirise-confidence-archive-audit-20261112
    paths:
      - experiments/e566_2025_hirise_confidence_archive_audit.py
      - experiments/e567_fom_confidence_point_support.py
      - experiments/e545_mola_observed_support.py
      - experiments/e563_three_way_common_support.py
      - tests/test_e566_2025_hirise_confidence_archive_audit.py
      - tests/test_e567_fom_confidence_point_support.py
      - .github/workflows/e567-fom-confidence-point-support.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e567-fom-confidence-point-support-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded geospatial dependencies
        run: python -m pip install "numpy>=1.26,<3" "requests>=2.31,<3" "tifffile>=2024.8,<2027" "rasterio>=1.4,<2" "pyproj>=3.6,<4" "pytest>=8,<9"
      - name: Run E566 and E567 deterministic fixtures
        run: python -m pytest -q tests/test_e566_2025_hirise_confidence_archive_audit.py tests/test_e567_fom_confidence_point_support.py
      - name: Decompress only the bounded 65.3 MB FOM confidence member and sample frozen MOLA points
        run: python -m experiments.e567_fom_confidence_point_support --out .artifacts/e567/receipt.json
      - name: Preserve compact receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e567-fom-confidence-point-support-receipt
          path: .artifacts/e567/receipt.json
          if-no-files-found: ignore
          retention-days: 14
