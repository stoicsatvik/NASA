name: E561 public ArcGIS analogue service schema and count audit

on:
  push:
    branches:
      - research/e561-arcgis-public-analogue-service-20261111
    paths:
      - experiments/e561_arcgis_analogue_service_audit.py
      - tests/test_e561_arcgis_analogue_service_audit.py
      - .github/workflows/e561-arcgis-analogue-service-audit.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - research/e560-usgs-known-analog-catalogue-20261111
    paths:
      - experiments/e561_arcgis_analogue_service_audit.py
      - tests/test_e561_arcgis_analogue_service_audit.py
      - .github/workflows/e561-arcgis-analogue-service-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e561-arcgis-analogue-service-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic E561 tests
        run: python -m unittest tests.test_e561_arcgis_analogue_service_audit -v
      - name: Fetch public service schema and count only
        run: python -m experiments.e561_arcgis_analogue_service_audit --out .artifacts/e561/receipt.json
      - name: Preserve compact receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e561-arcgis-analogue-service-audit
          path: .artifacts/e561/receipt.json
          if-no-files-found: ignore
          retention-days: 14
