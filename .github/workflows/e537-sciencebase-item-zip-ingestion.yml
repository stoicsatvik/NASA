name: E537 ScienceBase item ZIP ingestion

on:
  push:
    branches: [research/e537-sciencebase-item-zip-ingestion-20261111]
  pull_request:
    branches: [main, research/e536-grand-falls-raw-ingestion-20261111]
    paths:
      - "experiments/e537_sciencebase_item_zip_ingestion.py"
      - "tests/test_e537_sciencebase_item_zip_ingestion.py"
      - ".github/workflows/e537-sciencebase-item-zip-ingestion.yml"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded raster inspection dependencies
        run: python -m pip install requests==2.32.5 rasterio==1.4.3 numpy==2.2.6
      - name: Run deterministic E537 fixtures
        run: python -m unittest tests.test_e537_sciencebase_item_zip_ingestion -v
      - name: Attempt public ScienceBase item ZIP ingestion
        run: python experiments/e537_sciencebase_item_zip_ingestion.py
      - name: Preserve raw-data receipt and inspected sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e537-sciencebase-item-zip-ingestion
          path: .artifacts/e537/
          if-no-files-found: warn
          retention-days: 7
