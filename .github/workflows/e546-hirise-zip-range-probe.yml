name: E546 bounded HiRISE archive range-access feasibility

on:
  push:
    branches:
      - research/e546-hirise-zip-range-feasibility-20261111
    paths:
      - experiments/e546_hirise_zip_range_probe.py
      - tests/test_e546_hirise_zip_range_probe.py
      - research/E546_HIRISE_ZIP_RANGE_PROBE_20261111.md
      - FOUNDRY_STATE.md
      - .github/workflows/e546-hirise-zip-range-probe.yml
  pull_request:
    branches:
      - research/e545-mola-observed-support-20261111
    paths:
      - experiments/e546_hirise_zip_range_probe.py
      - tests/test_e546_hirise_zip_range_probe.py
      - research/E546_HIRISE_ZIP_RANGE_PROBE_20261111.md
      - FOUNDRY_STATE.md
      - .github/workflows/e546-hirise-zip-range-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-archive-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded experiment dependencies
        run: python -m pip install "requests>=2.31,<3" "pytest>=8,<9"
      - name: Run deterministic fixture tests
        run: python -m pytest -q tests/test_e546_hirise_zip_range_probe.py
      - name: Inspect ZIP tail and central directory using HTTP Range only
        run: python -m experiments.e546_hirise_zip_range_probe --out .artifacts/e546/receipt.json
      - name: Preserve compact receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e546-hirise-zip-range-receipt
          path: .artifacts/e546/receipt.json
          if-no-files-found: ignore
          retention-days: 14
