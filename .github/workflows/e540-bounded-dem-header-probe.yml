name: E540 bounded DEM header probe

on:
  push:
    branches:
      - research/e540-bounded-dem-header-probe-20261111
    paths:
      - experiments/e540_bounded_dem_header_probe.py
      - experiments/test_e540_bounded_dem_header_probe.py
      - .github/workflows/e540-bounded-dem-header-probe.yml
      - research/E540_BOUNDED_DEM_HEADER_PROBE_20261111.md
  pull_request:
    branches:
      - research/e539-public-cloud-url-metadata-audit-20261111
    paths:
      - experiments/e540_bounded_dem_header_probe.py
      - experiments/test_e540_bounded_dem_header_probe.py
      - .github/workflows/e540-bounded-dem-header-probe.yml
      - research/E540_BOUNDED_DEM_HEADER_PROBE_20261111.md

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic E540 tests
        run: python -m unittest experiments.test_e540_bounded_dem_header_probe -v
      - name: Probe exactly 32 bytes from the named DEM
        run: python -m experiments.e540_bounded_dem_header_probe --out .artifacts/e540/bounded-dem-header.json
      - name: Preserve bounded probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e540-bounded-dem-header
          path: .artifacts/e540/bounded-dem-header.json
          if-no-files-found: ignore
          retention-days: 30
