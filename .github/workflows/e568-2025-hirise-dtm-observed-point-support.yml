name: E568 2025 HiRISE DTM and FOM observed-point support

on:
  push:
    branches:
      - research/e568-2025-hirise-dtm-observed-point-support-20261112
    paths:
      - experiments/e566_2025_hirise_confidence_archive_audit.py
      - experiments/e545_mola_observed_support.py
      - experiments/e563_three_way_common_support.py
      - experiments/e568_2025_hirise_dtm_observed_point_support.py
      - tests/test_e566_2025_hirise_confidence_archive_audit.py
      - tests/test_e567_fom_confidence_point_support.py
      - tests/test_e568_2025_hirise_dtm_observed_point_support.py
      - .github/workflows/e568-2025-hirise-dtm-observed-point-support.yml
  pull_request:
    branches:
      - research/e567-fom-confidence-point-support-20261112
    paths:
      - experiments/e566_2025_hirise_confidence_archive_audit.py
      - experiments/e545_mola_observed_support.py
      - experiments/e563_three_way_common_support.py
      - experiments/e568_2025_hirise_dtm_observed_point_support.py
      - tests/test_e566_2025_hirise_confidence_archive_audit.py
      - tests/test_e567_fom_confidence_point_support.py
      - tests/test_e568_2025_hirise_dtm_observed_point_support.py
      - .github/workflows/e568-2025-hirise-dtm-observed-point-support.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e568-2025-hirise-dtm-observed-point-support-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded geospatial dependencies
        run: python -m pip install "numpy>=1.26,<3" "requests>=2.31,<3" "tifffile>=2024.8,<2027" "rasterio>=1.4,<2" "pyproj>=3.6,<4" "pytest>=8,<9"
      - name: Run deterministic range, ZIP and raster fixtures
        run: python -m pytest -q tests/test_e566_2025_hirise_confidence_archive_audit.py tests/test_e567_fom_confidence_point_support.py tests/test_e568_2025_hirise_dtm_observed_point_support.py
      - name: Stream only the 2025 DTM and FOM_Confidence members and sample frozen MOLA points
        run: python -m experiments.e568_2025_hirise_dtm_observed_point_support --out .artifacts/e568/receipt.json
      - name: Preserve compact receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e568-2025-hirise-dtm-observed-point-support
          path: .artifacts/e568/receipt.json
          if-no-files-found: ignore
          retention-days: 14
