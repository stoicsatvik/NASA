name: E375 pinned geology-subset sensitivity
on:
  push:
    branches:
      - research/e375-geology-subset-selection-stress-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-role-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pytest>=8,<10'
      - name: Offline source-role and AUC controls
        run: python -m pytest -q tests/test_e375_geology_subset_stress.py tests/test_e369_single_feature_control_baselines.py
      - name: Pinned public data, independent subset audit twice
        run: |
          python -m research.e375_geology_subset_stress > e375_receipt.json
          python -m research.e375_geology_subset_stress > e375_repeat.json
          cmp e375_receipt.json e375_repeat.json
          python - <<'PY'
          import json
          r=json.load(open("e375_receipt.json",encoding="utf-8"))
          assert r["source_commit"]=="f6c53ba50a9379d1c06f610b0e598395a0a54b43"
          for feature in ("vegetation","precipitation"):
              for mask in ("finite_only","land_fraction_ge_0_5"):
                  x=r["results"][feature][mask]
                  for body in ("mars","moon","all"):
                      y=x[body]
                      assert y["geology_n"]>0 and y["environment_n"]>0
                      assert y["editorial_n"]==8
                      for key,value in y.items():
                          if key.endswith("_auc"):
                              assert 0<=value<=1, (feature,mask,body,key,value)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e375-pinned-catalog-geology-subset-receipt
          path: e375_receipt.json
