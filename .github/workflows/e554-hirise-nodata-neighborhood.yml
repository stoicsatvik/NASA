name: E554 bounded HiRISE nodata neighborhood audit

on:
  push:
    branches:
      - research/e554-hirise-nodata-neighborhood-20261111
    paths:
      - experiments/e554_hirise_nodata_neighborhood.py
      - tests/test_e554_hirise_nodata_neighborhood.py
      - research/E554_HIRISE_NODATA_NEIGHBORHOOD_20261111.md
      - .github/workflows/e554-hirise-nodata-neighborhood.yml
      - data/e550_patch_summaries.json
  pull_request:
    branches:
      - research/e552-e550-missingness-sensitivity-20261111
    paths:
      - experiments/e554_hirise_nodata_neighborhood.py
      - tests/test_e554_hirise_nodata_neighborhood.py
      - research/E554_HIRISE_NODATA_NEIGHBORHOOD_20261111.md
      - data/e550_patch_summaries.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nodata-neighborhood:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install raster and CRS dependencies
        run: python -m pip install "numpy>=1.26,<3" "tifffile>=2024.8,<2027" "requests>=2.31,<3" "rasterio>=1.4,<2" "pyproj>=3.6,<4" "pytest>=8,<9"
      - name: Run deterministic mask-summary tests
        run: python -m pytest -q tests/test_e554_hirise_nodata_neighborhood.py
      - name: Run bounded live nodata-neighborhood probe
        run: python -m experiments.e554_hirise_nodata_neighborhood --out .artifacts/e554/receipt.json
      - name: Preserve compact receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e554-hirise-nodata-neighborhood
          path: .artifacts/e554/receipt.json
          if-no-files-found: ignore
          retention-days: 14
