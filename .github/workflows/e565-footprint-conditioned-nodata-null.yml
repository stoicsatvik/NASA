name: E565 footprint-conditioned HiRISE nodata null

on:
  push:
    branches:
      - research/e565-footprint-conditioned-nodata-null-20261112
    paths:
      - experiments/e563_three_way_common_support.py
      - tests/test_e563_three_way_common_support.py
      - tests/test_e564_hirise_support_clustering.py
      - tests/test_e565_footprint_conditioned_nodata_null.py
      - .github/workflows/e565-footprint-conditioned-nodata-null.yml
  pull_request:
    branches:
      - research/e564-hirise-support-clustering-20261112
    paths:
      - experiments/e563_three_way_common_support.py
      - tests/test_e563_three_way_common_support.py
      - tests/test_e564_hirise_support_clustering.py
      - tests/test_e565_footprint_conditioned_nodata_null.py
      - .github/workflows/e565-footprint-conditioned-nodata-null.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e565-footprint-conditioned-nodata-null-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded geospatial dependencies
        run: python -m pip install "numpy>=1.26,<3" "requests>=2.31,<3" "tifffile>=2024.8,<2027" "rasterio>=1.4,<2" "pyproj>=3.6,<4" "pytest>=8,<9"
      - name: Run E563, E564 and E565 deterministic tests
        run: python -m pytest -q tests/test_e563_three_way_common_support.py tests/test_e564_hirise_support_clustering.py tests/test_e565_footprint_conditioned_nodata_null.py
      - name: Reacquire bounded masks and calculate footprint-conditioned E565 diagnostic
        run: python -m experiments.e563_three_way_common_support --out .artifacts/e565/receipt.json
      - name: Preserve compact receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e565-footprint-conditioned-nodata-null-receipt
          path: .artifacts/e565/receipt.json
          if-no-files-found: ignore
          retention-days: 14
