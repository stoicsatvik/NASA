name: E214 real Earth SRTM-derived footprint sensitivity
on:
  push:
    branches:
      - foundry/e214-earth-dem-source-ablation-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  earth-dem-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded numerical dependencies
        run: python -m pip install 'numpy>=2.0,<3' 'rasterio>=1.4,<2' 'Pillow>=11,<13'
      - name: Run deterministic numerical and provenance controls
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download public Mapzen Skadi SRTM-derived Earth tiles read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .data/e214
          base='https://s3.amazonaws.com/elevation-tiles-prod/skadi'
          for tile in N19E076 N18E073 N34E077; do
            band="${tile:0:3}"
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 240 --silent --show-error \
              "$base/$band/$tile.hgt.gz" --output ".data/e214/$tile.hgt.gz"
            gzip -dc ".data/e214/$tile.hgt.gz" > ".data/e214/$tile.hgt"
          done
      - name: Execute real-data E214 and preserve numerical receipt
        shell: bash
        run: |
          set -euo pipefail
          python -m research.e214_earth_dem_site_qc \
            --lonar .data/e214/N19E076.hgt \
            --ghats .data/e214/N18E073.hgt \
            --ladakh .data/e214/N34E077.hgt | tee e214_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: e214-real-earth-dem-numerical-receipt
          path: e214_results.json
          retention-days: 30
