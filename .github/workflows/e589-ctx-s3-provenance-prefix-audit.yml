name: E589 CTX S3 provenance-prefix audit

on:
  push:
    branches:
      - research/e589-ctx-s3-provenance-prefix-audit-20261112
    paths:
      - experiments/e589_ctx_s3_provenance_prefix_audit.py
      - tests/test_e589_ctx_s3_provenance_prefix_audit.py
      - .github/workflows/e589-ctx-s3-provenance-prefix-audit.yml

permissions:
  contents: read

concurrency:
  group: e589-ctx-s3-provenance-prefix-audit
  cancel-in-progress: true

jobs:
  e589:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic S3 listing/parser tests
        run: python -m unittest discover -s tests -p "test_e589_ctx_s3_provenance_prefix_audit.py" -v
      - name: List exact public item prefix and inspect at most one provenance sidecar
        run: python experiments/e589_ctx_s3_provenance_prefix_audit.py --out .artifacts/e589/s3-prefix-audit.json
      - name: Upload aggregate receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e589-ctx-s3-provenance-prefix-audit
          path: .artifacts/e589/s3-prefix-audit.json
          if-no-files-found: ignore
          retention-days: 7
